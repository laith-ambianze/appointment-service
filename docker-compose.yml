version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appointment-service
    ports:
      - "8081:8081"
    environment:
      - GO_ENV=development
      - API_PORT=8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=appointments
      - DB_PASSWORD=password123
      - DB_NAME=appointments_dev
      - DB_SSL_MODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=debug
      - LOG_FORMAT=console
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appointment-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: appointment-postgres
    command: postgres -c 'hba_file=/etc/postgresql/pg_hba.conf'
    environment:
      - POSTGRES_USER=appointments
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=appointments_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deployments/docker/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - appointment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appointments"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: appointment-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_LISTEN_PORT=80
    ports:
      - "1998:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - appointment-network
    restart: unless-stopped
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: appointment-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - appointment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  prometheus:
    image: prom/prometheus:latest
    container_name: appointment-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - appointment-network
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: appointment-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - appointment-network
    restart: unless-stopped
    depends_on:
      - prometheus

networks:
  appointment-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
  pgadmin-data:
